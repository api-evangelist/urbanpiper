aid: urbanpiper
url: https://raw.githubusercontent.com/api-evangelist/urbanpiper/refs/heads/main/apis.yml
name: UrbanPiper
kind: company
description: UrbanPiper is a restaurant commerce platform whose POS-integration API
  connects a restaurant's POS/ERP to online ordering aggregators (Swiggy, Zomato,
  UberEats, DoorDash, Deliveroo, Talabat, Amazon, Careem and more). The REST API
  covers catalogue/menu management, store and item/option availability, order relay
  and order status updates, and outbound webhooks, powering the Prime, Hub and Atlas
  products.
