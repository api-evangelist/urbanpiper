specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: UrbanPiper
providerId: urbanpiper
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Restaurants
- Food Delivery
- Ordering
- POS
- Aggregators
- Commerce
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of UrbanPiper spend. UrbanPiper bills via a sales-led SaaS
  subscription (per outlet/brand) for its Prime, Hub, Atlas and POS-integration
  products rather than usage-based per-call API metering. There is no public
  per-request price, so cost allocation is driven by outlet count, enabled
  aggregator channels, brands and contracted product mix. Numeric rates are not
  reconciled in this artifact.
notes: >-
  Subscription rates are negotiated with UrbanPiper sales and are not published;
  verify against an actual invoice/quote during reconciliation. Meters below model
  the operational dimensions a customer would tag for allocation, not published
  billable units.
sources:
- https://www.urbanpiper.com/
- https://www.urbanpiper.com/hub
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: UrbanPiper
serviceCategory: Restaurant Commerce Platform
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: UrbanPiper Platform
  ServiceCategory: Restaurant Commerce Platform
  ProviderName: UrbanPiper
  PublisherName: UrbanPiper
  InvoiceIssuerName: UrbanPiper
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription
meters:
- name: active_outlets
  description: Number of active stores/locations subscribed to the platform, a primary allocation dimension.
  unit: outlets
  aggregation: max
  dimensions:
  - account
  - brand
  - location
- name: brands
  description: Number of brands/businesses configured (multi-brand allocation via X-UPR-Biz-Id).
  unit: brands
  aggregation: max
  dimensions:
  - account
  - brand
- name: aggregator_channels
  description: Number of enabled aggregator channels (Swiggy, Zomato, UberEats, etc.) per outlet.
  unit: channels
  aggregation: max
  dimensions:
  - account
  - location
  - aggregator
- name: orders_processed
  description: Orders relayed and managed through the platform, an operational volume dimension.
  unit: orders
  aggregation: sum
  dimensions:
  - account
  - location
  - aggregator
- name: product_modules
  description: Subscribed product modules (Prime, Hub, Atlas) contributing to the subscription charge.
  unit: modules
  aggregation: max
  dimensions:
  - account
  - product
principles:
- name: Visibility
  description: Track active outlets, brands and enabled aggregator channels against the contracted subscription to understand drivers of spend.
- name: Allocation
  description: Tag outlets and brands (via X-UPR-Biz-Id) to cost centers; allocate subscription cost per location and per product module.
- name: Optimization
  description: Disable unused aggregator channels and inactive outlets; consolidate brands; right-size the product mix (Prime/Hub/Atlas) to actual need.
- name: Accountability
  description: Assign owners per brand/region; review the subscription against active outlet count and order volume each billing cycle.
maintainers:
